[package]
edition = "2021"
rust-version = "1.88"
name = "femtovg"
version = "0.27.0"
authors = [
    "Peter Todorov <ptodorov@cytec.bg>",
    "Adam Nemecek <adamnemecek@gmail.com>",
]
